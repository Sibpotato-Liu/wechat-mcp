[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-mcp"
version = "0.1.0"
description = "Read-only MCP server for exporting WeChat 3.x / 4.x chat history"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "cryptography>=41.0.0",
    "zstandard>=0.21.0",
]

[project.scripts]
wechat-mcp = "wechat_mcp.server:main"
wechat-mcp-cli = "wechat_mcp.cli:main"
wechat-mcp-probe = "wechat_mcp.probe:main"

[tool.setuptools.packages.find]
include = ["wechat_mcp*"]
